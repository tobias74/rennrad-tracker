[package]
name = "rennrad-tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
async-stream = "0.3"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
